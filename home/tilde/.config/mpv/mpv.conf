# Включаем движок на базе libplacebo (обязательно для DV)
vo=gpu-next

# ВАЖНО: Для Dolby Vision Profile 5 на Linux часто нужно ОТКЛЮЧИТЬ 
# аппаратное декодирование, иначе видеокарта отдает "сырую" картинку 
# без метаданных цветов.
hwdec=no

# Настройки тональной компрессии
tone-mapping=bt.2446a
# Принудительно выводить звук в стерео
audio-channels=stereo

# Связка: вытягиваем голос из центрального канала + жестко сжимаем диапазон
af="lavfi=[pan=stereo|c0=1.2*c2+0.6*c0+0.3*c4|c1=1.2*c2+0.6*c1+0.3*c5],lavfi=[dynaudnorm=f=50:g=35:p=0.5:m=10.0]"
audio-file-auto=fuzzy
