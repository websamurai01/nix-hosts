# EXEC-ONCE (AUTORUN)

# --- POLKIT (Запускается через systemd, эти строки удаляем/комментируем) ---
# exec-once = /usr/bin/lxqt-policykit-agent
# exec-once = /usr/lib/polkit-gnome-authentication-agent-1 &

# --- WALLPAPER ---
exec-once = swww img /home/hash/Wallpapers/wallpaper.jpg

# --- APPS ---
exec-once = $HOME/.scripts/waybar-reminder.sh &
exec-once = dunst &
exec-once = mako &
exec-once = $HOME/.config/hypr/scripts/assign_workspaces.sh &

# --- НАЗНАЧАЕМ ГЛАВНЫЙ МОНИТОР ДЛЯ ИГР (XWAYLAND) ---
exec-once = xrandr --output HDMI-A-1 --primary
exec-once=waybar
